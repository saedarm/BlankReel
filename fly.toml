# Change "app" to something unique; it becomes https://<app>.fly.dev
app = "blankreel-sam"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when nobody's using it, wakes on the next visit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpus = 1
  cpu_kind = "shared"

[mounts]
  source = "blankreel_data"
  destination = "/data"
